name: PeraWave CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./code/PeraWaveFrontEnd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Tests
        run: npm run test

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./code/PeraWaveBackEnd

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db?schema=public

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Backend Dependencies
        run: npm install

      - name: Setup Test Environment Variables
        run: |
          printf 'DATABASE_URL=postgresql://postgres:password@localhost:5432/test_db?schema=public\nJWT_SECRET=PeraWaveSuperSecretKey2026\nPORT=8080\n' > .env.test

      - name: Run Backend Unit Tests (Mocked)
        run: npx vitest run src/tests/server.test.ts src/tests/wiki.test.ts
        env:
          NODE_ENV: test

      - name: Run Backend Integration Tests (Real DB)
        run: npm run test:integration
        env:
          NODE_ENV: test
