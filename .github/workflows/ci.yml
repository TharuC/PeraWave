name: PeraWave CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./code/PeraWaveFrontEnd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./code/PeraWaveFrontEnd/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-24.04

    # Spin up a temporary PostgreSQL container just for this job
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./code/PeraWaveBackEnd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./code/PeraWaveBackEnd/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Setup Test Environment Variables
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgresql://postgres:password@localhost:5432/test_db?schema=test
          JWT_SECRET=PeraWaveSuperSecretKey2026
          PORT=8080
          EOF

      - name: Run Backend Unit Tests (Mocked)
        run: npm run test
        env:
          NODE_ENV: test

      - name: Run Backend Integration Tests (Real DB)
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db?schema=test
